<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 랜덤 문제 생성기 뱅크 ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)],nz=(a,b)=>{let v=0;while(!v)v=R(a,b);return v};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
const sgn=n=>n<0?'-':'+',abs=Math.abs;
const term=(c,v,first)=>{if(c===0)return '';const s=c<0?'-':(first?'':'+');const m=abs(c)===1?'':abs(c);return `${s}${first||c<0?'':''}${m}${v}`.replace(/^\+/,'')};
const poly=(a,b,c)=>{/* ax²+bx+c */let s='';if(a){s+=(a===1?'':a===-1?'-':a)+'x²'}if(b){s+=(s?(b<0?' - ':' + '):(b<0?'-':''))+(abs(b)===1?'':abs(b))+'x'}if(c){s+=(s?(c<0?' - ':' + '):(c<0?'-':''))+abs(c)}return s||'0'};
const lin=(a,b)=>poly(0,a,b);
const frac=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?String(n):`${n}/${d}`};
const fmt=x=>Number.isInteger(x)?String(x):String(Math.round(x*100)/100);
const BANK=[];
const add=(g,topic,name,gen,kind)=>BANK.push({g,topic,name,gen,kind:kind||'num'});
/* ---------- 중1 ---------- */
[[10,50],[50,200],[100,999]].forEach(([lo,hi],k)=>{
 add('m1','수와 연산',`덧셈 ${k+1}단계`,()=>{const a=R(lo,hi),b=R(lo,hi);return{q:`${a} + ${b} = ?`,a:a+b,sol:`${a}+${b}=${a+b}`}});
 add('m1','수와 연산',`뺄셈 ${k+1}단계`,()=>{const a=R(lo,hi),b=R(lo,hi);return{q:`${a} − ${b} = ?`,a:a-b,sol:`${a}−${b}=${a-b}`}});
 add('m1','수와 연산',`곱셈 ${k+1}단계`,()=>{const a=R(2,k?19:9),b=R(lo/10,hi/10);return{q:`${a} × ${b} = ?`,a:a*b,sol:`${a}×${b}=${a*b}`}});
 add('m1','수와 연산',`나눗셈 ${k+1}단계`,()=>{const b=R(2,k?15:9),c=R(2,k?30:12);return{q:`${b*c} ÷ ${b} = ?`,a:c,sol:`${b}×${c}=${b*c}`}});
});
add('m1','소인수분해','소인수분해 지수',()=>{const p=pick([2,3,5]),e=R(2,4),q=pick([2,3,5,7].filter(x=>x!==p));const n=p**e*q;return{q:`${n}을 소인수분해하면 ${p}<sup>a</sup>×${q}이다. a = ?`,a:e,sol:`${n}=${p}^${e}×${q}`}});
add('m1','소인수분해','약수의 개수',()=>{const a=R(1,3),b=R(1,2);const n=2**a*3**b;return{q:`${n}의 약수의 개수는?`,a:(a+1)*(b+1),sol:`${n}=2^${a}×3^${b} → (${a}+1)(${b}+1)=${(a+1)*(b+1)}`}});
add('m1','소인수분해','최대공약수',()=>{const g=R(2,12),a=g*R(2,9),b=g*R(2,9);return{q:`${a}과 ${b}의 최대공약수는?`,a:gcd(a,b),sol:`공통 소인수의 곱 = ${gcd(a,b)}`}});
add('m1','소인수분해','최소공배수',()=>{const a=R(4,15),b=R(4,15);return{q:`${a}과 ${b}의 최소공배수는?`,a:lcm(a,b),sol:`${a}×${b}÷최대공약수 ${gcd(a,b)} = ${lcm(a,b)}`}});
add('m1','소인수분해','거듭제곱 값',()=>{const b=R(2,6),e=R(2,4);return{q:`${b}<sup>${e}</sup> = ?`,a:b**e,sol:`${b}를 ${e}번 곱함`}});
add('m1','소인수분해','소수 판별',()=>{const n=R(10,60);const p=n>1&&[...Array(n-2)].every((_,i)=>n%(i+2));return{q:`${n}은 소수이다. (O/X)`,a:p?'O':'X',sol:p?`${n}은 1과 자신 외에 약수가 없음`:`${n}=${[...Array(n-2)].map((_,i)=>i+2).find(d=>n%d===0)}×${n/[...Array(n-2)].map((_,i)=>i+2).find(d=>n%d===0)}`}},'ox');
[['덧셈','+',(a,b)=>a+b],['뺄셈','−',(a,b)=>a-b],['곱셈','×',(a,b)=>a*b]].forEach(([n,sym,f])=>{
 add('m1','정수와 유리수',`정수의 ${n}`,()=>{const a=nz(-20,20),b=nz(-20,20);return{q:`(${a}) ${sym} (${b}) = ?`,a:f(a,b),sol:`부호 규칙을 적용하면 ${f(a,b)}`}});
 add('m1','정수와 유리수',`정수의 ${n} 세 수`,()=>{const a=nz(-15,15),b=nz(-15,15),c=nz(-15,15);return{q:`(${a}) ${sym} (${b}) ${sym} (${c}) = ?`,a:f(f(a,b),c),sol:`앞에서부터 차례로 계산`}});
});
add('m1','정수와 유리수','정수의 나눗셈',()=>{const b=nz(-9,9),c=nz(-9,9);return{q:`(${b*c}) ÷ (${b}) = ?`,a:c,sol:`${b}×${c}=${b*c}`}});
add('m1','정수와 유리수','절댓값',()=>{const a=nz(-30,30);return{q:`|${a}| = ?`,a:abs(a),sol:'절댓값은 0으로부터의 거리'}});
add('m1','정수와 유리수','절댓값 합',()=>{const a=nz(-20,20),b=nz(-20,20);return{q:`|${a}| + |${b}| = ?`,a:abs(a)+abs(b),sol:`${abs(a)}+${abs(b)}`}});
add('m1','정수와 유리수','음수의 거듭제곱',()=>{const b=R(2,5),e=R(2,4);return{q:`(−${b})<sup>${e}</sup> = ?`,a:(-b)**e,sol:e%2?'홀수 제곱은 음수':'짝수 제곱은 양수'}});
add('m1','정수와 유리수','분수 덧셈',()=>{const d1=R(2,9),d2=R(2,9),n1=R(1,d1-1),n2=R(1,d2-1);const d=lcm(d1,d2),n=n1*d/d1+n2*d/d2;return{q:`${n1}/${d1} + ${n2}/${d2} = ? (기약분수, 예: 7/6)`,a:frac(n,d),sol:`통분: 분모 ${d}`}},'str');
add('m1','정수와 유리수','분수 곱셈',()=>{const a=R(1,9),b=R(2,9),c=R(1,9),d=R(2,9);return{q:`${a}/${b} × ${c}/${d} = ? (기약분수)`,a:frac(a*c,b*d),sol:`분자끼리, 분모끼리 곱한 뒤 약분`}},'str');
add('m1','정수와 유리수','혼합 계산',()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return{q:`${a} + ${b} × ${c} = ?`,a:a+b*c,sol:'곱셈 먼저'}});
add('m1','정수와 유리수','괄호 계산',()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return{q:`(${a} + ${b}) × ${c} = ?`,a:(a+b)*c,sol:'괄호 먼저'}});
add('m1','문자와 식','식의 값',()=>{const a=R(2,9),b=R(1,9),x=R(1,9);return{q:`x = ${x}일 때, ${lin(a,b)}의 값은?`,a:a*x+b,sol:`${a}×${x}+${b}`}});
add('m1','문자와 식','식의 값(음수 대입)',()=>{const a=R(2,9),b=R(1,9),x=-R(1,9);return{q:`x = ${x}일 때, ${lin(a,b)}의 값은?`,a:a*x+b,sol:`${a}×(${x})+${b}`}});
add('m1','문자와 식','식의 값(두 문자)',()=>{const x=R(1,6),y=R(1,6),a=R(1,5),b=R(1,5);return{q:`x = ${x}, y = ${y}일 때, ${a}x + ${b}y의 값은?`,a:a*x+b*y,sol:`${a}×${x}+${b}×${y}`}});
add('m1','문자와 식','동류항 정리(x 계수)',()=>{const a=R(1,9),b=nz(-9,9),c=R(1,9),d=nz(-9,9);return{q:`${lin(a,b)} + ${lin(c,d)}을 간단히 하면 ax + b. a = ?`,a:a+c,sol:`x항끼리: ${a}+${c}`}});
add('m1','문자와 식','동류항 정리(상수항)',()=>{const a=R(1,9),b=nz(-9,9),c=R(1,9),d=nz(-9,9);return{q:`${lin(a,b)} + ${lin(c,d)}을 간단히 하면 ax + b. b = ?`,a:b+d,sol:`상수항끼리: ${b}+(${d})`}});
add('m1','문자와 식','분배법칙',()=>{const k=R(2,6),a=R(1,9),b=nz(-9,9);return{q:`${k}(${lin(a,b)})을 전개하면 ax + b. a + b = ?`,a:k*a+k*b,sol:`${k*a}x ${sgn(k*b)} ${abs(k*b)}`}});
add('m1','일차방정식','ax = b',()=>{const a=R(2,9),x=nz(-9,9);return{q:`${a}x = ${a*x}일 때 x = ?`,a:x,sol:`양변을 ${a}로 나눔`}});
add('m1','일차방정식','x + a = b',()=>{const a=nz(-15,15),x=nz(-15,15);return{q:`x ${sgn(a)} ${abs(a)} = ${x+a}일 때 x = ?`,a:x,sol:`${x+a} ${sgn(-a)} ${abs(a)}`}});
add('m1','일차방정식','ax + b = c',()=>{const a=R(2,9),b=nz(-9,9),x=nz(-9,9);return{q:`${lin(a,b)} = ${a*x+b}일 때 x = ?`,a:x,sol:`${a}x = ${a*x} → x = ${x}`}});
add('m1','일차방정식','ax + b = cx + d',()=>{const a=R(2,9),c=R(1,a-1<1?1:a-1),x=nz(-9,9),b=nz(-9,9);const d=a*x+b-c*x;return{q:`${lin(a,b)} = ${lin(c,d)}일 때 x = ?`,a:x,sol:`${a-c}x = ${d-b} → x = ${x}`}});
add('m1','일차방정식','괄호가 있는 방정식',()=>{const k=R(2,5),a=R(1,5),x=nz(-9,9),b=nz(-5,5);return{q:`${k}(x ${sgn(a)} ${abs(a)}) = ${k*(x+a)}일 때 x = ?`,a:x,sol:`x ${sgn(a)} ${abs(a)} = ${x+a}`}});
add('m1','일차방정식','분수 방정식',()=>{const d=R(2,6),x=d*R(1,9),a=nz(-9,9);return{q:`x/${d} ${sgn(a)} ${abs(a)} = ${x/d+a}일 때 x = ?`,a:x,sol:`x/${d} = ${x/d} → x = ${x}`}});
add('m1','일차방정식','활용: 나이',()=>{const y=R(10,16),d=R(20,35);return{q:`현재 아버지 나이는 아들보다 ${d}세 많고, 두 사람 나이의 합은 ${2*y+d}세이다. 아들의 나이는?`,a:y,sol:`x+(x+${d})=${2*y+d} → x=${y}`}});
add('m1','일차방정식','활용: 거리',()=>{const v=R(3,6),t=R(2,5);return{q:`시속 ${v}km로 ${t}시간 걸으면 몇 km?`,a:v*t,sol:'거리=속력×시간'}});
add('m1','일차방정식','활용: 연속한 세 수',()=>{const n=R(5,40);return{q:`연속한 세 자연수의 합이 ${3*n+3}일 때 가장 작은 수는?`,a:n,sol:`x+(x+1)+(x+2)=${3*n+3}`}});
add('m1','좌표평면','점의 사분면',()=>{const x=nz(-9,9),y=nz(-9,9);const qd=x>0?(y>0?1:4):(y>0?2:3);return{q:`점 (${x}, ${y})은 제 몇 사분면 위의 점인가? (숫자만)`,a:qd,sol:'x,y의 부호로 판단'}});
add('m1','좌표평면','정비례 상수',()=>{const a=nz(-6,6),x=nz(-6,6);return{q:`y = ax에서 x = ${x}일 때 y = ${a*x}이다. a = ?`,a,sol:`a = ${a*x}/${x}`}});
add('m1','좌표평면','반비례 상수',()=>{const a=nz(-12,12)*2,x=nz(-6,6);return{q:`y = a/x에서 x = ${x}일 때 y = ${a/x}이다. a = ?`,a,sol:`a = xy = ${x}×${a/x}`}});
add('m1','좌표평면','정비례 함숫값',()=>{const a=nz(-5,5),x=nz(-9,9);return{q:`y = ${a}x에서 x = ${x}일 때 y = ?`,a:a*x,sol:`${a}×${x}`}});
add('m1','좌표평면','두 점 사이 거리(x축 평행)',()=>{const x1=nz(-9,9),x2=nz(-9,9),y=R(-5,5);return{q:`두 점 (${x1}, ${y}), (${x2}, ${y}) 사이의 거리는?`,a:abs(x1-x2),sol:'x좌표 차의 절댓값'}});
add('m1','평면도형','삼각형 내각',()=>{const a=R(30,80),b=R(30,80);return{q:`삼각형의 두 내각이 ${a}°, ${b}°일 때 나머지 한 각은?`,a:180-a-b,sol:'내각의 합 180°'}});
add('m1','평면도형','다각형 내각의 합',()=>{const n=R(5,12);return{q:`${n}각형의 내각의 합은 몇 도?`,a:180*(n-2),sol:`180×(${n}−2)`}});
add('m1','평면도형','정다각형 한 내각',()=>{const n=pick([5,6,8,9,10,12]);return{q:`정${n}각형의 한 내각의 크기는?`,a:180*(n-2)/n,sol:`180(${n}−2)/${n}`}});
add('m1','평면도형','대각선 개수',()=>{const n=R(5,12);return{q:`${n}각형의 대각선의 개수는?`,a:n*(n-3)/2,sol:`n(n−3)/2`}});
add('m1','평면도형','삼각형 넓이',()=>{const b=R(4,20),h=R(2,16)*2;return{q:`밑변 ${b}, 높이 ${h}인 삼각형의 넓이는?`,a:b*h/2,sol:'밑변×높이÷2'}});
add('m1','평면도형','사다리꼴 넓이',()=>{const a=R(3,12),b=R(3,12),h=R(2,10)*2;return{q:`윗변 ${a}, 아랫변 ${b}, 높이 ${h}인 사다리꼴의 넓이는?`,a:(a+b)*h/2,sol:'(윗변+아랫변)×높이÷2'}});
add('m1','평면도형','원의 둘레(π)',()=>{const r=R(2,15);return{q:`반지름 ${r}인 원의 둘레는 aπ이다. a = ?`,a:2*r,sol:'2πr'}});
add('m1','평면도형','원의 넓이(π)',()=>{const r=R(2,12);return{q:`반지름 ${r}인 원의 넓이는 aπ이다. a = ?`,a:r*r,sol:'πr²'}});
add('m1','평면도형','부채꼴 호의 길이',()=>{const r=R(2,12),t=pick([30,45,60,90,120,180]);return{q:`반지름 ${r}, 중심각 ${t}°인 부채꼴의 호의 길이는 aπ. a = ? (소수 가능)`,a:2*r*t/360,sol:`2πr×${t}/360`}});
add('m1','평면도형','맞꼭지각',()=>{const a=R(20,160);return{q:`두 직선이 만나 생긴 한 각이 ${a}°일 때 그 맞꼭지각은?`,a,sol:'맞꼭지각은 서로 같다'}});
add('m1','입체도형','직육면체 부피',()=>{const a=R(2,10),b=R(2,10),c=R(2,10);return{q:`가로 ${a}, 세로 ${b}, 높이 ${c}인 직육면체의 부피는?`,a:a*b*c,sol:'가로×세로×높이'}});
add('m1','입체도형','정육면체 겉넓이',()=>{const a=R(2,12);return{q:`한 모서리가 ${a}인 정육면체의 겉넓이는?`,a:6*a*a,sol:'6a²'}});
add('m1','입체도형','원기둥 부피(π)',()=>{const r=R(2,8),h=R(2,12);return{q:`밑면 반지름 ${r}, 높이 ${h}인 원기둥의 부피는 aπ. a = ?`,a:r*r*h,sol:'πr²h'}});
add('m1','입체도형','각뿔 부피',()=>{const s=R(3,10),h=R(3,12)*3;return{q:`밑면이 한 변 ${s}인 정사각형이고 높이 ${h}인 사각뿔의 부피는?`,a:s*s*h/3,sol:'밑넓이×높이÷3'}});
add('m1','입체도형','구의 부피(π)',()=>{const r=R(1,6)*3;return{q:`반지름 ${r}인 구의 부피는 aπ. a = ?`,a:4*r**3/3,sol:'4/3πr³'}});
add('m1','통계','평균',()=>{const n=R(4,6),arr=[...Array(n)].map(()=>R(1,20));const m=arr.reduce((a,b)=>a+b,0)/n;return{q:`자료 ${arr.join(', ')}의 평균은? (소수 가능)`,a:m,sol:`합 ${arr.reduce((a,b)=>a+b,0)} ÷ ${n}`}});
add('m1','통계','중앙값',()=>{const arr=[...Array(5)].map(()=>R(1,30)).sort((a,b)=>a-b);return{q:`자료 ${arr.join(', ')}의 중앙값은?`,a:arr[2],sol:'크기순 가운데 값'}});
add('m1','통계','최빈값',()=>{const m=R(1,9),arr=[m,m,R(1,9),R(1,9),m,R(10,19)].sort(()=>Math.random()-.5);return{q:`자료 ${arr.join(', ')}의 최빈값은?`,a:m,sol:'가장 많이 나온 값'}});
add('m1','통계','상대도수',()=>{const t=pick([20,25,40,50]),f=R(2,t/2);return{q:`전체 도수 ${t}, 어떤 계급의 도수 ${f}일 때 상대도수는? (소수)`,a:f/t,sol:`${f}/${t}`}});
/* ---------- 중2 ---------- */
add('m2','유리수와 순환소수','순환마디',()=>{const d=pick([3,9,11,33]),n=R(1,d-1);const s=(n/d).toFixed(8);return{q:`${n}/${d}을 소수로 나타낼 때 순환마디의 숫자 개수는?`,a:d===3||d===9?1:2,sol:`${n}/${d} = ${s}…`}});
add('m2','유리수와 순환소수','유한소수 판별',()=>{const d=pick([4,5,8,10,16,20,25,3,6,7,9,12,15]),n=1;const f=d%2===0||d%5===0?[2,5].every(p=>{let x=d;[2,5].forEach(q=>{while(x%q===0)x/=q});return x===1}):false;return{q:`1/${d}은 유한소수로 나타낼 수 있다. (O/X)`,a:f?'O':'X',sol:'분모의 소인수가 2, 5뿐이면 유한소수'}},'ox');
add('m2','유리수와 순환소수','순환소수를 분수로',()=>{const n=R(1,8);return{q:`0.${n}${n}${n}… 을 기약분수로 나타내면? (예: 1/3)`,a:frac(n,9),sol:`${n}/9`}},'str');
[['곱셈','×',(a,b)=>a+b],['나눗셈','÷',(a,b)=>a-b]].forEach(([n,sym,f])=>add('m2','식의 계산',`지수법칙 ${n}`,()=>{const a=R(2,9),b=R(2,a);return{q:`x<sup>${a}</sup> ${sym} x<sup>${b}</sup> = x<sup>k</sup>. k = ?`,a:f(a,b),sol:`지수의 ${n==='곱셈'?'합':'차'}`}}));
add('m2','식의 계산','거듭제곱의 거듭제곱',()=>{const a=R(2,5),b=R(2,5);return{q:`(x<sup>${a}</sup>)<sup>${b}</sup> = x<sup>k</sup>. k = ?`,a:a*b,sol:'지수의 곱'}});
add('m2','식의 계산','단항식의 곱',()=>{const a=R(2,6),b=R(2,6),p=R(1,4),q=R(1,4);return{q:`${a}x<sup>${p}</sup> × ${b}x<sup>${q}</sup> = kx<sup>${p+q}</sup>. k = ?`,a:a*b,sol:'계수끼리 곱'}});
add('m2','식의 계산','다항식 전개 계수',()=>{const a=R(1,5),b=nz(-6,6),c=R(1,5),d=nz(-6,6);return{q:`(${lin(a,b)})(${lin(c,d)})을 전개했을 때 x의 계수는?`,a:a*d+b*c,sol:`${a}×${d}+${b}×${c}`}});
add('m2','식의 계산','곱셈 공식 (a+b)²',()=>{const b=nz(-9,9);return{q:`(x ${sgn(b)} ${abs(b)})² = x² + px + q. q = ?`,a:b*b,sol:'b²'}});
add('m2','식의 계산','곱셈 공식 (a+b)(a−b)',()=>{const b=R(2,12);return{q:`(x + ${b})(x − ${b}) = x² − k. k = ?`,a:b*b,sol:'a²−b²'}});
add('m2','식의 계산','곱셈 공식 활용',()=>{const n=pick([101,99,102,98,1001,999]);return{q:`${n}²을 곱셈 공식으로 계산하면?`,a:n*n,sol:`(${n>500?1000:100}${n%100>50?'−':'+'}${abs(n-(n>500?1000:100))})²`}});
add('m2','일차부등식','부등식 풀기',()=>{const a=R(2,6),b=nz(-9,9),x=nz(-9,9);return{q:`${lin(a,b)} > ${a*x+b}의 해는 x > k. k = ?`,a:x,sol:`${a}x > ${a*x}`}});
add('m2','일차부등식','음수로 나누기',()=>{const a=-R(2,6),x=nz(-9,9);return{q:`${a}x > ${a*x}의 해는 x < k. k = ?`,a:x,sol:'음수로 나누면 부등호 방향이 바뀜'}});
add('m2','일차부등식','자연수 해의 개수',()=>{const k=R(3,12);return{q:`부등식 2x < ${2*k+1}을 만족하는 자연수 x의 개수는?`,a:k,sol:`x < ${k}.5`}});
add('m2','일차부등식','활용: 최대 개수',()=>{const p=R(5,15)*100,m=R(20,60)*100;return{q:`한 개 ${p}원인 물건을 ${m}원으로 최대 몇 개 살 수 있나?`,a:Math.floor(m/p),sol:`${p}x ≤ ${m}`}});
add('m2','연립방정식','연립방정식 x',()=>{const x=nz(-6,6),y=nz(-6,6),a=R(1,4),b=R(1,4),c=R(1,4),d=R(1,4);if(a*d===b*c)return{q:`x + y = ${x+y}, x − y = ${x-y}. x = ?`,a:x,sol:'두 식을 더함'};return{q:`${a}x + ${b}y = ${a*x+b*y}, ${c}x + ${d}y = ${c*x+d*y}. x = ?`,a:x,sol:'가감법 또는 대입법'}});
add('m2','연립방정식','연립방정식 y',()=>{const x=nz(-6,6),y=nz(-6,6);return{q:`x + y = ${x+y}, 2x + y = ${2*x+y}. y = ?`,a:y,sol:`두 식을 빼면 x = ${x}`}});
add('m2','연립방정식','활용: 닭과 토끼',()=>{const c=R(3,12),r=R(3,12);return{q:`닭과 토끼가 모두 ${c+r}마리, 다리는 ${2*c+4*r}개. 토끼는 몇 마리?`,a:r,sol:'x+y, 2x+4y'}});
add('m2','연립방정식','활용: 합과 차',()=>{const a=R(10,50),b=R(1,a-1);return{q:`두 수의 합이 ${a+b}, 차가 ${a-b}일 때 큰 수는?`,a,sol:'(합+차)/2'}});
add('m2','일차함수','기울기',()=>{const a=nz(-6,6),b=nz(-9,9),x1=R(-5,5),x2=x1+R(1,5);return{q:`두 점 (${x1}, ${a*x1+b}), (${x2}, ${a*x2+b})을 지나는 직선의 기울기는?`,a,sol:'y의 증가량/x의 증가량'}});
add('m2','일차함수','y절편',()=>{const a=nz(-6,6),b=nz(-9,9),x=nz(-5,5);return{q:`기울기 ${a}이고 점 (${x}, ${a*x+b})을 지나는 직선의 y절편은?`,a:b,sol:`y = ${a}x + b에 대입`}});
add('m2','일차함수','x절편',()=>{const a=nz(-5,5),x0=nz(-8,8);return{q:`y = ${lin(a,-a*x0)}의 x절편은?`,a:x0,sol:'y=0 대입'}});
add('m2','일차함수','함숫값',()=>{const a=nz(-6,6),b=nz(-9,9),x=nz(-9,9);return{q:`f(x) = ${lin(a,b)}일 때 f(${x}) = ?`,a:a*x+b,sol:'대입'}});
add('m2','일차함수','평행 조건',()=>{const a=nz(-6,6),b=nz(-9,9);return{q:`y = ${lin(a,b)}과 평행하고 y절편이 ${b+3}인 직선 y = px + q. p = ?`,a,sol:'평행하면 기울기 같음'}});
add('m2','일차함수','두 점 지나는 직선 y절편',()=>{const a=nz(-4,4),b=nz(-9,9),x1=nz(-5,5),x2=x1+R(1,4);return{q:`(${x1}, ${a*x1+b}), (${x2}, ${a*x2+b})을 지나는 직선의 y절편은?`,a:b,sol:`기울기 ${a}, 대입`}});
add('m2','일차함수','활용: 온도',()=>{const b=R(10,25),a=R(2,6),t=R(1,9);return{q:`처음 ${b}℃인 물을 데우면 1분에 ${a}℃씩 오른다. ${t}분 후 온도는?`,a:b+a*t,sol:`y = ${a}x + ${b}`}});
add('m2','삼각형의 성질','이등변삼각형 각',()=>{const t=R(20,80);return{q:`꼭지각이 ${t}°인 이등변삼각형의 한 밑각은?`,a:(180-t)/2,sol:'(180−꼭지각)/2'}});
add('m2','삼각형의 성질','외각',()=>{const a=R(30,70),b=R(30,70);return{q:`삼각형의 두 내각 ${a}°, ${b}°에 이웃하지 않는 외각의 크기는?`,a:a+b,sol:'외각 = 이웃하지 않는 두 내각의 합'}});
add('m2','삼각형의 성질','직각삼각형 각',()=>{const a=R(10,80);return{q:`직각삼각형에서 한 예각이 ${a}°일 때 다른 예각은?`,a:90-a,sol:'두 예각의 합 90°'}});
add('m2','삼각형의 성질','평행사변형 각',()=>{const a=R(40,140);return{q:`평행사변형의 한 내각이 ${a}°일 때 이웃한 각은?`,a:180-a,sol:'이웃한 두 각의 합 180°'}});
add('m2','도형의 닮음','닮음비 길이',()=>{const k=R(2,5),a=R(2,9);return{q:`닮음비가 1:${k}인 두 삼각형에서 작은 삼각형의 한 변이 ${a}일 때 대응변의 길이는?`,a:a*k,sol:'닮음비 적용'}});
add('m2','도형의 닮음','넓이비',()=>{const m=R(2,5),n=R(m+1,7);return{q:`닮음비가 ${m}:${n}인 두 도형의 넓이비는 a:b (기약). b = ?`,a:n*n/gcd(m*m,n*n),sol:'넓이비는 닮음비의 제곱'}});
add('m2','도형의 닮음','축척',()=>{const s=pick([1000,5000,10000,50000]),d=R(2,9);return{q:`축척 1:${s} 지도에서 ${d}cm는 실제 몇 m?`,a:d*s/100,sol:`${d}×${s}cm`}});
add('m2','확률','경우의 수(합)',()=>{const a=R(2,6),b=R(2,6);return{q:`A에서 B로 가는 길이 ${a}가지, B에서 C로 ${b}가지일 때 A에서 C로 가는 경우의 수는?`,a:a*b,sol:'곱의 법칙'}});
add('m2','확률','주사위 두 개 합',()=>{const s=R(3,11);const n=[...Array(6)].reduce((c,_,i)=>c+[...Array(6)].filter((_,j)=>i+1+j+1===s).length,0);return{q:`주사위 두 개를 던져 눈의 합이 ${s}이 되는 경우의 수는?`,a:n,sol:'순서쌍 세기'}});
add('m2','확률','확률(분수)',()=>{const n=R(2,5);return{q:`1~10 카드 중 한 장 뽑아 ${n}의 배수일 확률은? (기약분수)`,a:frac(Math.floor(10/n),10),sol:`${Math.floor(10/n)}/10`}},'str');
add('m2','확률','여사건',()=>{const p=R(1,9);return{q:`비가 올 확률이 ${p}/10일 때 비가 오지 않을 확률은? (분수)`,a:frac(10-p,10),sol:'1−p'}},'str');
add('m2','확률','일렬 배열',()=>{const n=R(3,5);return{q:`${n}명을 일렬로 세우는 경우의 수는?`,a:[1,1,2,6,24,120][n],sol:`${n}!`}});
add('m2','확률','대표 뽑기',()=>{const n=R(4,8);return{q:`${n}명 중 회장 1명, 부회장 1명을 뽑는 경우의 수는?`,a:n*(n-1),sol:'n(n−1)'}});
add('m2','확률','두 명 뽑기(순서 무관)',()=>{const n=R(4,10);return{q:`${n}명 중 대표 2명을 뽑는 경우의 수는?`,a:n*(n-1)/2,sol:'n(n−1)/2'}});
/* ---------- 중3 ---------- */
add('m3','제곱근','제곱근 값',()=>{const n=R(2,15);return{q:`√${n*n} = ?`,a:n,sol:`${n}²=${n*n}`}});
add('m3','제곱근','제곱근 간단히',()=>{const k=pick([2,3,5]),n=R(2,7);return{q:`√${n*n*k} = a√${k}. a = ?`,a:n,sol:`√(${n}²×${k})`}});
add('m3','제곱근','제곱근 곱',()=>{const a=R(2,9),b=R(2,9);return{q:`√${a} × √${b} = √k. k = ?`,a:a*b,sol:'√a√b=√ab'}});
add('m3','제곱근','제곱근 덧셈',()=>{const k=pick([2,3,5,7]),a=R(1,9),b=R(1,9);return{q:`${a}√${k} + ${b}√${k} = c√${k}. c = ?`,a:a+b,sol:'동류 근호끼리'}});
add('m3','제곱근','제곱근 크기 비교',()=>{const n=R(2,99);const f=Math.floor(Math.sqrt(n));return{q:`√${n}은 ${f} < √${n} < ${f+1}을 만족한다. 정수 부분은?`,a:f,sol:`${f}²=${f*f} ≤ ${n} < ${(f+1)**2}`}});
add('m3','제곱근','분모 유리화',()=>{const a=R(1,9),k=pick([2,3,5]);return{q:`${a}/√${k} = (a√${k})/${k}. a = ?`,a,sol:'분모·분자에 √k 곱'}});
add('m3','인수분해','x²+bx+c 인수분해',()=>{const p=nz(-9,9),q=nz(-9,9);return{q:`${poly(1,p+q,p*q)} = (x + a)(x + b). a + b = ?`,a:p+q,sol:`합 ${p+q}, 곱 ${p*q}`}});
add('m3','인수분해','완전제곱식',()=>{const b=nz(-9,9);return{q:`${poly(1,2*b,b*b)} = (x + k)². k = ?`,a:b,sol:'(x+b)²'}});
add('m3','인수분해','완전제곱식 만들기',()=>{const b=R(1,9)*2;return{q:`x² + ${b}x + k가 완전제곱식이 되는 k = ?`,a:(b/2)**2,sol:'(b/2)²'}});
add('m3','인수분해','합차 공식',()=>{const b=R(2,12);return{q:`x² − ${b*b} = (x + a)(x − a). a = ?`,a:b,sol:'a²−b²=(a+b)(a−b)'}});
add('m3','인수분해','공통인수',()=>{const k=R(2,9),a=R(1,9),b=R(1,9);return{q:`${k*a}x² + ${k*b}x의 공통인수를 묶으면 kx(ax + b). k = ?`,a:k,sol:'계수의 최대공약수'}});
add('m3','인수분해','acx²+(ad+bc)x+bd',()=>{const a=R(2,3),b=nz(-5,5),c=R(1,3),d=nz(-5,5);return{q:`${poly(a*c,a*d+b*c,b*d)} = (${lin(a,b)})(cx + d). d = ?`,a:d,sol:'인수분해 후 비교'}});
add('m3','이차방정식','인수분해로 풀기(큰 근)',()=>{const p=nz(-9,9),q=nz(-9,9);return{q:`${poly(1,-(p+q),p*q)} = 0의 두 근 중 큰 것은?`,a:Math.max(p,q),sol:`(x−${p})(x−${q})=0`}});
add('m3','이차방정식','근의 합',()=>{const p=nz(-9,9),q=nz(-9,9);return{q:`${poly(1,-(p+q),p*q)} = 0의 두 근의 합은?`,a:p+q,sol:'−b/a'}});
add('m3','이차방정식','근의 곱',()=>{const p=nz(-9,9),q=nz(-9,9);return{q:`${poly(1,-(p+q),p*q)} = 0의 두 근의 곱은?`,a:p*q,sol:'c/a'}});
add('m3','이차방정식','중근 조건',()=>{const b=R(1,9)*2;return{q:`x² + ${b}x + k = 0이 중근을 가질 때 k = ?`,a:b*b/4,sol:'판별식=0'}});
add('m3','이차방정식','x²=k 꼴',()=>{const n=R(2,12);return{q:`x² = ${n*n}의 양의 근은?`,a:n,sol:'±√'}});
add('m3','이차방정식','활용: 넓이',()=>{const x=R(3,12);return{q:`가로가 세로보다 ${2}cm 긴 직사각형의 넓이가 ${x*(x+2)}cm²일 때 세로는?`,a:x,sol:`x(x+2)=${x*(x+2)}`}});
add('m3','이차함수','꼭짓점 x좌표',()=>{const p=nz(-6,6),q=nz(-9,9);return{q:`y = (x ${sgn(-p)} ${abs(p)})² ${sgn(q)} ${abs(q)}의 꼭짓점의 x좌표는?`,a:p,sol:'(p, q)'}});
add('m3','이차함수','꼭짓점 y좌표(일반형)',()=>{const p=nz(-5,5),q=nz(-9,9);return{q:`y = ${poly(1,-2*p,p*p+q)}의 꼭짓점의 y좌표는?`,a:q,sol:`y=(x−${p})²+${q}`}});
add('m3','이차함수','함숫값',()=>{const a=nz(-3,3),b=nz(-5,5),c=nz(-9,9),x=nz(-4,4);return{q:`y = ${poly(a,b,c)}에서 x = ${x}일 때 y = ?`,a:a*x*x+b*x+c,sol:'대입'}});
add('m3','이차함수','볼록 방향',()=>{const a=nz(-5,5);return{q:`y = ${a}x²의 그래프는 아래로 볼록하다. (O/X)`,a:a>0?'O':'X',sol:'a>0이면 아래로 볼록'}},'ox');
add('m3','이차함수','y절편',()=>{const a=nz(-3,3),b=nz(-5,5),c=nz(-9,9);return{q:`y = ${poly(a,b,c)}의 y절편은?`,a:c,sol:'x=0'}});
add('m3','이차함수','축의 방정식',()=>{const p=nz(-6,6);return{q:`y = 2(x ${sgn(-p)} ${abs(p)})² + 1의 축의 방정식은 x = k. k = ?`,a:p,sol:'x = p'}});
add('m3','삼각비','sin 값',()=>{const t=pick([30,45,60]);const v={30:'1/2',45:'√2/2',60:'√3/2'}[t];return{q:`sin ${t}° = ? (예: 1/2, √2/2, √3/2)`,a:v,sol:'특수각 삼각비'}},'str');
add('m3','삼각비','cos 값',()=>{const t=pick([30,45,60]);const v={30:'√3/2',45:'√2/2',60:'1/2'}[t];return{q:`cos ${t}° = ?`,a:v,sol:'특수각 삼각비'}},'str');
add('m3','삼각비','tan 값',()=>{const t=pick([30,45,60]);const v={30:'√3/3',45:'1',60:'√3'}[t];return{q:`tan ${t}° = ? (예: 1, √3, √3/3)`,a:v,sol:'특수각 삼각비'}},'str');
add('m3','삼각비','피타고라스',()=>{const [a,b,c]=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[7,24,25],[9,12,15]]);return{q:`직각삼각형의 두 변이 ${a}, ${b}일 때 빗변은?`,a:c,sol:'a²+b²=c²'}});
add('m3','삼각비','피타고라스(한 변)',()=>{const [a,b,c]=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17]]);return{q:`빗변 ${c}, 한 변 ${a}인 직각삼각형의 다른 변은?`,a:b,sol:'c²−a²'}});
add('m3','삼각비','sin으로 높이',()=>{const h=R(2,9);return{q:`빗변 ${2*h}, 한 예각 30°인 직각삼각형에서 30° 맞은편 변의 길이는?`,a:h,sol:'sin30°=1/2'}});
add('m3','원의 성질','원주각',()=>{const c=R(20,80)*2;return{q:`중심각이 ${c}°일 때 같은 호에 대한 원주각은?`,a:c/2,sol:'원주각은 중심각의 절반'}});
add('m3','원의 성질','반원 원주각',()=>({q:`반원에 대한 원주각의 크기는?`,a:90,sol:'지름 → 90°'}));
add('m3','원의 성질','현의 길이',()=>{const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13]]);return{q:`반지름 ${c}인 원에서 중심으로부터 거리 ${a}인 현의 길이는?`,a:2*b,sol:'수직이등분, 피타고라스'}});
add('m3','원의 성질','접선 길이',()=>{const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]);return{q:`반지름 ${a}인 원의 중심에서 ${c} 떨어진 점에서 그은 접선의 길이는?`,a:b,sol:'접선⊥반지름'}});
add('m3','원의 성질','내접사각형',()=>{const a=R(60,120);return{q:`원에 내접하는 사각형의 한 각이 ${a}°일 때 마주 보는 각은?`,a:180-a,sol:'대각의 합 180°'}});
add('m3','통계','분산',()=>{const arr=[...Array(4)].map(()=>R(1,9));const m=arr.reduce((a,b)=>a+b,0)/4;const v=arr.reduce((a,x)=>a+(x-m)**2,0)/4;return{q:`자료 ${arr.join(', ')}의 분산은? (소수 둘째 자리까지)`,a:Math.round(v*100)/100,sol:`평균 ${m}, 편차 제곱의 평균`}});
add('m3','통계','표준편차',()=>{const m=R(3,9),d=pick([1,2,3]);const arr=[m-d,m-d,m+d,m+d];return{q:`자료 ${arr.join(', ')}의 표준편차는?`,a:d,sol:`분산 ${d*d}의 제곱근`}});
add('m3','통계','편차의 합',()=>({q:`어떤 자료의 편차의 총합은 항상?`,a:0,sol:'편차의 합은 0'}));
add('m3','통계','산점도 상관',()=>{const r=pick([['키가 클수록 몸무게가 무거워진다','양'],['기온이 높을수록 난방비가 줄어든다','음'],['공부 시간이 길수록 성적이 오른다','양']]);return{q:`"${r[0]}" — 양의 상관관계이면 O, 음의 상관관계이면 X`,a:r[1]==='양'?'O':'X',sol:r[1]+'의 상관관계'}},'ox');
/* ---------- 고1 ---------- */
add('h1','다항식','나머지정리',()=>{const a=nz(-3,3),b=nz(-5,5),c=nz(-9,9),k=nz(-3,3);return{q:`${poly(a,b,c)}을 x − ${k}로 나눈 나머지는?`,a:a*k*k+b*k+c,sol:`f(${k})`}});
add('h1','다항식','인수정리',()=>{const k=nz(-4,4),b=nz(-5,5);const c=-(k*k+b*k);return{q:`${poly(1,b,c)}이 x − ${k}로 나누어떨어진다. (O/X)`,a:'O',sol:`f(${k})=0`}},'ox');
add('h1','다항식','항등식 계수',()=>{const a=nz(-5,5),b=nz(-5,5);return{q:`모든 x에 대해 ${lin(a,b)} = px + q이면 p + q = ?`,a:a+b,sol:'계수 비교'}});
add('h1','다항식','조립제법 몫',()=>{const k=nz(-3,3),p=nz(-4,4),q=nz(-4,4);const b=p-k,c=q-k*p,d=-k*q;return{q:`${poly(1,b,c)}x + ${d}를 x − ${k}로 나눈 몫 x² + mx + n에서 m = ?`,a:p,sol:'조립제법'}});
add('h1','복소수','허수단위 거듭제곱',()=>{const n=R(2,20);const v=[1,'i',-1,'-i'][n%4];return{q:`i<sup>${n}</sup> = ? (1, -1, i, -i 중)`,a:String(v),sol:'i의 주기 4'}},'str');
add('h1','복소수','복소수 덧셈 실수부',()=>{const a=nz(-9,9),b=nz(-9,9),c=nz(-9,9),d=nz(-9,9);return{q:`(${a} + ${b}i) + (${c} + ${d}i)의 실수부는?`,a:a+c,sol:'실수부끼리'}});
add('h1','복소수','복소수 곱 실수부',()=>{const a=nz(-5,5),b=nz(-5,5),c=nz(-5,5),d=nz(-5,5);return{q:`(${a} + ${b}i)(${c} + ${d}i)의 실수부는?`,a:a*c-b*d,sol:'ac−bd'}});
add('h1','복소수','켤레복소수 곱',()=>{const a=nz(-6,6),b=nz(-6,6);return{q:`(${a} + ${b}i)(${a} − ${b}i) = ?`,a:a*a+b*b,sol:'a²+b²'}});
add('h1','이차방정식','판별식',()=>{const a=R(1,3),b=nz(-9,9),c=nz(-9,9);return{q:`${poly(a,b,c)} = 0의 판별식 D = ?`,a:b*b-4*a*c,sol:'b²−4ac'}});
add('h1','이차방정식','근의 개수',()=>{const a=1,b=nz(-8,8),c=nz(-9,9);const D=b*b-4*c;return{q:`${poly(1,b,c)} = 0의 서로 다른 실근의 개수는?`,a:D>0?2:D===0?1:0,sol:`D=${D}`}});
add('h1','이차방정식','근과 계수 α²+β²',()=>{const s=nz(-6,6),p=nz(-6,6);return{q:`x² ${sgn(-s)} ${abs(s)}x ${sgn(p)} ${abs(p)} = 0의 두 근 α, β에 대해 α² + β² = ?`,a:s*s-2*p,sol:'(α+β)²−2αβ'}});
add('h1','이차방정식','두 근이 주어진 방정식',()=>{const p=nz(-6,6),q=nz(-6,6);return{q:`두 근이 ${p}, ${q}이고 x²의 계수가 1인 이차방정식 x² + bx + c에서 c = ?`,a:p*q,sol:'두 근의 곱'}});
add('h1','이차함수','최댓값',()=>{const p=nz(-5,5),q=nz(-9,9);return{q:`y = −(x ${sgn(-p)} ${abs(p)})² ${sgn(q)} ${abs(q)}의 최댓값은?`,a:q,sol:'위로 볼록, 꼭짓점'}});
add('h1','이차함수','구간 최솟값',()=>{const p=R(1,3),q=nz(-5,5);return{q:`0 ≤ x ≤ 5에서 y = (x − ${p})² ${sgn(q)} ${abs(q)}의 최솟값은?`,a:q,sol:'꼭짓점이 구간 안'}});
add('h1','이차함수','직선과 교점 개수',()=>{const k=nz(-5,5);const D=1+4*k;return{q:`y = x²과 y = x + ${k}의 교점의 개수는?`,a:D>0?2:D===0?1:0,sol:`x²−x−${k}=0의 판별식 ${D}`}});
add('h1','집합과 명제','합집합 원소 수',()=>{const a=R(3,10),b=R(3,10),c=R(1,Math.min(a,b));return{q:`n(A) = ${a}, n(B) = ${b}, n(A∩B) = ${c}일 때 n(A∪B) = ?`,a:a+b-c,sol:'n(A)+n(B)−n(A∩B)'}});
add('h1','집합과 명제','부분집합 개수',()=>{const n=R(2,7);return{q:`원소가 ${n}개인 집합의 부분집합의 개수는?`,a:2**n,sol:'2ⁿ'}});
add('h1','집합과 명제','여집합 원소 수',()=>{const u=R(10,30),a=R(2,9);return{q:`n(U) = ${u}, n(A) = ${a}일 때 n(A<sup>c</sup>) = ?`,a:u-a,sol:'U−A'}});
add('h1','집합과 명제','명제의 역',()=>pick([{q:`명제 "x = 2이면 x² = 4이다"의 역은 참이다. (O/X)`,a:'X',sol:'x=−2 반례'},{q:`명제 "x > 3이면 x > 1이다"의 대우는 참이다. (O/X)`,a:'O',sol:'원명제가 참이면 대우도 참'},{q:`명제 "정사각형이면 마름모이다"의 역은 참이다. (O/X)`,a:'X',sol:'마름모가 모두 정사각형은 아님'}]),'ox');
add('h1','집합과 명제','진부분집합 개수',()=>{const n=R(2,6);return{q:`원소가 ${n}개인 집합의 진부분집합의 개수는?`,a:2**n-1,sol:'2ⁿ−1'}});
add('h1','함수','합성함수',()=>{const a=R(1,4),b=nz(-5,5),c=R(1,4),d=nz(-5,5),x=nz(-4,4);return{q:`f(x) = ${lin(a,b)}, g(x) = ${lin(c,d)}일 때 (f∘g)(${x}) = ?`,a:a*(c*x+d)+b,sol:`f(g(${x})) = f(${c*x+d})`}});
add('h1','함수','역함수 값',()=>{const a=R(2,5),b=nz(-9,9),y=nz(-4,4);return{q:`f(x) = ${lin(a,b)}일 때 f<sup>-1</sup>(${a*y+b}) = ?`,a:y,sol:`f(y)=${a*y+b}인 y`}});
add('h1','함수','유리함수 점근선',()=>{const p=nz(-5,5),q=nz(-5,5);return{q:`y = 1/(x ${sgn(-p)} ${abs(p)}) ${sgn(q)} ${abs(q)}의 점근선 x = k. k = ?`,a:p,sol:'분모=0'}});
add('h1','함수','무리함수 정의역',()=>{const k=nz(-9,9);return{q:`y = √(x ${sgn(-k)} ${abs(k)})의 정의역은 x ≥ m. m = ?`,a:k,sol:'근호 안 ≥ 0'}});
add('h1','경우의 수','순열 nPr',()=>{const n=R(4,8),r=R(2,3);let v=1;for(let i=0;i<r;i++)v*=n-i;return{q:`<sub>${n}</sub>P<sub>${r}</sub> = ?`,a:v,sol:`n(n−1)…`}});
add('h1','경우의 수','조합 nCr',()=>{const n=R(4,9),r=R(2,3);let v=1;for(let i=0;i<r;i++)v=v*(n-i)/(i+1);return{q:`<sub>${n}</sub>C<sub>${r}</sub> = ?`,a:v,sol:'n!/(r!(n−r)!)'}});
add('h1','경우의 수','원순열',()=>{const n=R(4,7);return{q:`${n}명이 원탁에 둘러앉는 경우의 수는?`,a:[1,1,1,2,6,24,120,720][n],sol:'(n−1)!'}});
add('h1','경우의 수','같은 것이 있는 순열',()=>{const w=pick([['AABB',6],['AAAB',4],['AABBC',30],['ABCDD',60]]);return{q:`문자 ${w[0]}를 일렬로 나열하는 경우의 수는?`,a:w[1],sol:'n!/(p!q!)'}});
add('h1','경우의 수','중복순열',()=>{const n=R(2,4),r=R(2,3);return{q:`${n}개의 숫자로 만들 수 있는 ${r}자리 수(중복 허용)의 개수는?`,a:n**r,sol:'nʳ'}});
add('h1','도형의 방정식','두 점 거리',()=>{const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]);const x=nz(-5,5),y=nz(-5,5);return{q:`두 점 (${x}, ${y}), (${x+a}, ${y+b}) 사이의 거리는?`,a:c,sol:'거리 공식'}});
add('h1','도형의 방정식','중점',()=>{const x1=nz(-9,9),x2=x1+2*R(1,5),y1=R(-5,5);return{q:`두 점 (${x1}, ${y1}), (${x2}, ${y1+4})의 중점의 x좌표는?`,a:(x1+x2)/2,sol:'(x1+x2)/2'}});
add('h1','도형의 방정식','내분점',()=>{const x1=R(-5,5),x2=x1+3*R(1,3);return{q:`(${x1}, 0), (${x2}, 0)을 1:2로 내분하는 점의 x좌표는?`,a:(2*x1+x2)/3,sol:'(mx2+nx1)/(m+n)'}});
add('h1','도형의 방정식','직선의 기울기(수직)',()=>{const a=nz(-5,5);return{q:`기울기 ${a}인 직선에 수직인 직선의 기울기는? (분수 가능, 예: -1/3)`,a:frac(-1,a),sol:'곱이 −1'}},'str');
add('h1','도형의 방정식','점과 직선 거리',()=>{const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13]]);const d=R(1,4)*c;return{q:`원점과 직선 ${a}x + ${b}y − ${d} = 0 사이의 거리는?`,a:d/c,sol:'|c|/√(a²+b²)'}});
add('h1','도형의 방정식','원의 반지름',()=>{const a=nz(-5,5),b=nz(-5,5),r=R(1,6);return{q:`x² + y² ${sgn(-2*a)} ${abs(2*a)}x ${sgn(-2*b)} ${abs(2*b)}y ${sgn(a*a+b*b-r*r)} ${abs(a*a+b*b-r*r)} = 0의 반지름은?`,a:r,sol:'표준형으로 변형'}});
add('h1','도형의 방정식','원과 직선 위치관계',()=>{const r=R(2,5),d=R(1,7);return{q:`반지름 ${r}인 원의 중심에서 직선까지 거리가 ${d}일 때 교점의 개수는?`,a:d<r?2:d===r?1:0,sol:'d와 r 비교'}});
add('h1','도형의 방정식','평행이동',()=>{const a=nz(-5,5),p=nz(-5,5);return{q:`점 (${a}, 0)을 x축 방향으로 ${p}만큼 평행이동한 점의 x좌표는?`,a:a+p,sol:'x+p'}});
/* ---------- 고2 ---------- */
add('h2','지수와 로그','지수 계산',()=>{const a=pick([2,3,5]),m=R(2,5),n=R(1,m-1);return{q:`${a}<sup>${m}</sup> ÷ ${a}<sup>${n}</sup> = ?`,a:a**(m-n),sol:'지수의 차'}});
add('h2','지수와 로그','거듭제곱근',()=>{const b=R(2,5),e=pick([2,3]);return{q:`<sup>${e}</sup>√${b**e} = ?`,a:b,sol:`${b}^${e}=${b**e}`}});
add('h2','지수와 로그','음의 지수',()=>{const a=pick([2,3,5]),n=R(1,3);return{q:`${a}<sup>−${n}</sup> = ? (분수, 예: 1/8)`,a:frac(1,a**n),sol:'1/aⁿ'}},'str');
add('h2','지수와 로그','로그 값',()=>{const a=pick([2,3,5,10]),n=R(1,4);return{q:`log<sub>${a}</sub> ${a**n} = ?`,a:n,sol:`${a}^${n}`}});
add('h2','지수와 로그','로그 성질(합)',()=>{const a=R(2,9),b=R(2,9);return{q:`log ${a} + log ${b} = log k. k = ?`,a:a*b,sol:'log a + log b = log ab'}});
add('h2','지수와 로그','로그 성질(차)',()=>{const b=R(2,9),k=R(2,9);return{q:`log ${b*k} − log ${b} = log k. k = ?`,a:k,sol:'log(a/b)'}});
add('h2','지수와 로그','상용로그',()=>{const n=R(1,5);return{q:`log 10<sup>${n}</sup> = ?`,a:n,sol:'log 10ⁿ = n'}});
add('h2','지수와 로그','지수방정식',()=>{const a=pick([2,3,5]),x=R(1,5);return{q:`${a}<sup>x</sup> = ${a**x}일 때 x = ?`,a:x,sol:'밑을 같게'}});
add('h2','지수와 로그','로그방정식',()=>{const x=R(1,4);return{q:`log<sub>2</sub>(x + 1) = ${Math.log2(x+1)===Math.floor(Math.log2(x+1))?Math.log2(x+1):2}일 때 x = ?`,a:Math.log2(x+1)===Math.floor(Math.log2(x+1))?x:3,sol:'지수형으로'}});
add('h2','삼각함수','호도법 변환',()=>{const d=pick([30,45,60,90,120,180,270,360]);return{q:`${d}°를 라디안으로 나타내면 kπ. k = ? (분수 가능, 예: 1/6)`,a:frac(d,180),sol:'π/180 곱'}},'str');
add('h2','삼각함수','sin 특수각(라디안)',()=>{const r=pick([['π/6','1/2'],['π/4','√2/2'],['π/3','√3/2'],['π/2','1'],['π','0']]);return{q:`sin(${r[0]}) = ?`,a:r[1],sol:'특수각'}},'str');
add('h2','삼각함수','cos 특수각(라디안)',()=>{const r=pick([['π/6','√3/2'],['π/4','√2/2'],['π/3','1/2'],['π/2','0'],['π','-1']]);return{q:`cos(${r[0]}) = ?`,a:r[1],sol:'특수각'}},'str');
add('h2','삼각함수','주기',()=>{const k=R(1,4);return{q:`y = sin ${k}x의 주기는 aπ. a = ? (분수 가능)`,a:frac(2,k),sol:'2π/k'}},'str');
add('h2','삼각함수','최댓값',()=>{const a=R(1,5),b=nz(-5,5);return{q:`y = ${a}sin x ${sgn(b)} ${abs(b)}의 최댓값은?`,a:a+b,sol:'a+b'}});
add('h2','삼각함수','sin²+cos²',()=>{const t=R(1,89);return{q:`sin²${t}° + cos²${t}° = ?`,a:1,sol:'항등식'}});
add('h2','삼각함수','사인법칙',()=>{const R2=R(2,6);return{q:`삼각형 ABC에서 a = ${R2}, A = 30°일 때 외접원의 반지름은?`,a:R2,sol:'a/sinA = 2R'}});
add('h2','삼각함수','코사인법칙',()=>{const b=R(2,6),c=R(2,6);return{q:`b = ${b}, c = ${c}, A = 60°일 때 a² = ?`,a:b*b+c*c-b*c,sol:'b²+c²−2bc cosA'}});
add('h2','수열','등차수열 일반항',()=>{const a=nz(-9,9),d=nz(-5,5),n=R(5,20);return{q:`첫째항 ${a}, 공차 ${d}인 등차수열의 제${n}항은?`,a:a+(n-1)*d,sol:'a+(n−1)d'}});
add('h2','수열','등차수열 합',()=>{const a=R(1,9),d=R(1,5),n=R(5,12);return{q:`첫째항 ${a}, 공차 ${d}인 등차수열의 첫 ${n}항의 합은?`,a:n*(2*a+(n-1)*d)/2,sol:'n(2a+(n−1)d)/2'}});
add('h2','수열','등비수열 일반항',()=>{const a=R(1,5),r=pick([2,3,-2]),n=R(3,7);return{q:`첫째항 ${a}, 공비 ${r}인 등비수열의 제${n}항은?`,a:a*r**(n-1),sol:'arⁿ⁻¹'}});
add('h2','수열','등비수열 합',()=>{const a=R(1,4),r=pick([2,3]),n=R(3,6);return{q:`첫째항 ${a}, 공비 ${r}인 등비수열의 첫 ${n}항의 합은?`,a:a*(r**n-1)/(r-1),sol:'a(rⁿ−1)/(r−1)'}});
add('h2','수열','등차중항',()=>{const a=nz(-9,9),b=a+2*R(1,9);return{q:`${a}, x, ${b}가 등차수열일 때 x = ?`,a:(a+b)/2,sol:'(a+b)/2'}});
add('h2','수열','등비중항',()=>{const a=R(1,6),r=R(2,4);return{q:`${a}, x, ${a*r*r}가 등비수열일 때 양수 x = ?`,a:a*r,sol:'√(ab)'}});
add('h2','수열','시그마 계산',()=>{const n=R(5,15);return{q:`Σ<sub>k=1</sub><sup>${n}</sup> k = ?`,a:n*(n+1)/2,sol:'n(n+1)/2'}});
add('h2','수열','시그마 제곱',()=>{const n=R(3,8);return{q:`Σ<sub>k=1</sub><sup>${n}</sup> k² = ?`,a:n*(n+1)*(2*n+1)/6,sol:'n(n+1)(2n+1)/6'}});
add('h2','수열','수학적 귀납법',()=>({q:`1+2+…+n = n(n+1)/2를 증명할 때, n = k+1에서 더해지는 항은 k + 1이다. (O/X)`,a:'O',sol:'좌변에 (k+1)을 더함'}),'ox');
add('h2','극한','수열의 극한',()=>{const a=R(1,9),b=R(1,9);return{q:`lim (${a}n + 1)/(${b}n + 3) = ? (분수 가능)`,a:frac(a,b),sol:'최고차항 계수의 비'}},'str');
add('h2','극한','함수의 극한',()=>{const a=nz(-3,3),b=nz(-5,5),x=nz(-3,3);return{q:`lim<sub>x→${x}</sub> (${lin(a,b)}) = ?`,a:a*x+b,sol:'연속함수는 대입'}});
add('h2','극한','0/0꼴 극한',()=>{const k=nz(-5,5),m=nz(-5,5);return{q:`lim<sub>x→${k}</sub> (x² ${sgn(-(k+m))} ${abs(k+m)}x ${sgn(k*m)} ${abs(k*m)})/(x − ${k}) = ?`,a:k-m,sol:`(x−${k})(x−${m})/(x−${k})`}});
add('h2','극한','무한등비급수',()=>{const a=R(1,9),r=pick([2,3,4,5]);return{q:`첫째항 ${a}, 공비 1/${r}인 무한등비급수의 합은? (분수 가능)`,a:frac(a*r,r-1),sol:'a/(1−r)'}},'str');
add('h2','미분','도함수 값',()=>{const a=nz(-3,3),b=nz(-5,5),c=nz(-9,9),x=nz(-3,3);return{q:`f(x) = ${poly(a,b,c)}일 때 f'(${x}) = ?`,a:2*a*x+b,sol:`f'(x)=${2*a}x${sgn(b)}${abs(b)}`}});
add('h2','미분','삼차함수 도함수',()=>{const a=nz(-2,2),x=nz(-3,3);return{q:`f(x) = ${a}x³ + x일 때 f'(${x}) = ?`,a:3*a*x*x+1,sol:'3ax²+1'}});
add('h2','미분','접선의 기울기',()=>{const a=R(1,3),x=nz(-4,4);return{q:`y = ${a}x² 위의 점 x = ${x}에서 접선의 기울기는?`,a:2*a*x,sol:"y'=2ax"}});
add('h2','미분','접선의 y절편',()=>{const x=nz(-3,3);return{q:`y = x² 위의 점 (${x}, ${x*x})에서의 접선의 y절편은?`,a:-x*x,sol:`y = ${2*x}x − ${x*x}`}});
add('h2','미분','극값(극소 x)',()=>{const p=nz(-4,4),q=p+R(1,4);return{q:`f'(x) = (x − ${p})(x − ${q})일 때 f(x)가 극소가 되는 x = ?`,a:q,sol:'부호가 −에서 +로 바뀌는 점'}});
add('h2','미분','평균변화율',()=>{const a=nz(-3,3),b=a+R(1,4);return{q:`f(x) = x²에서 x가 ${a}에서 ${b}까지 변할 때 평균변화율은?`,a:a+b,sol:'(f(b)−f(a))/(b−a) = a+b'}});
add('h2','미분','속도',()=>{const a=R(1,5),t=R(1,5);return{q:`위치 x(t) = ${a}t²일 때 t = ${t}에서의 속도는?`,a:2*a*t,sol:"x'(t)=2at"}});
add('h2','적분','부정적분',()=>{const n=R(1,4);return{q:`∫ ${n+1}x<sup>${n}</sup> dx = x<sup>k</sup> + C. k = ?`,a:n+1,sol:'지수 +1'}});
add('h2','적분','정적분(x)',()=>{const b=R(1,6);return{q:`∫<sub>0</sub><sup>${b}</sup> 2x dx = ?`,a:b*b,sol:'[x²]'}});
add('h2','적분','정적분(상수)',()=>{const c=R(1,9),a=nz(-3,3),b=a+R(1,5);return{q:`∫<sub>${a}</sub><sup>${b}</sup> ${c} dx = ?`,a:c*(b-a),sol:'c(b−a)'}});
add('h2','적분','정적분(x²)',()=>{const b=R(1,4);return{q:`∫<sub>0</sub><sup>${b}</sup> 3x² dx = ?`,a:b**3,sol:'[x³]'}});
add('h2','적분','넓이',()=>{const k=R(1,4);return{q:`y = ${k}x와 x축, x = 2로 둘러싸인 넓이는?`,a:2*k,sol:'삼각형 넓이 = ∫'}});
add('h2','적분','짝함수 정적분',()=>{const a=R(1,4);return{q:`∫<sub>−${a}</sub><sup>${a}</sup> x³ dx = ?`,a:0,sol:'홀함수'}});

add('h3','확률','조건부확률',()=>{const b=R(2,9),ab=R(1,b);return{q:`P(B) = ${b}/10, P(A∩B) = ${ab}/10일 때 P(A|B) = ? (기약분수)`,a:frac(ab,b),sol:'P(A∩B)/P(B)'}},'str');

function normAns(s){return String(s).trim().replace(/\s+/g,'').replace(/−/g,'-').replace(/×/g,'*').replace(/루트/g,'√').replace(/^\+/,'').toLowerCase()}
function parseNum(s){s=normAns(s);if(/^-?\d+\/\d+$/.test(s)){const [a,b]=s.split('/');return a/b}if(/^-?\d*\.?\d+$/.test(s))return +s;return NaN}
function checkAns(kind,user,ans){if(kind==='ox')return normAns(user).replace(/o|ㅇ|맞|참/,'o').replace(/x|ㅌ|틀|거짓/,'x')===normAns(ans);if(kind==='str'){const u=normAns(user),a=normAns(ans);if(u===a)return true;const un=parseNum(u),an=parseNum(a);return !isNaN(un)&&!isNaN(an)&&Math.abs(un-an)<1e-6}const u=parseNum(user),a=typeof ans==='number'?ans:parseNum(ans);return !isNaN(u)&&Math.abs(u-a)<=Math.max(0.011,Math.abs(a)*1e-6)}

function runSet(el,qs,opt){let i=0,ok=0,hints=0;const res=[];
 const one=()=>{const p=qs[i];let used=0;el.innerHTML=`<div class="card"><div class="row between"><span class="eyebrow">${i+1}/${qs.length} · ${esc(p.b.topic)} · ${esc(p.b.name)}</span><span class="pill">정답 ${ok}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div><div class="q">${p.q}</div>
  ${p.b.kind==='ox'?`<div class="row"><button class="pri" data-ans="O" style="font-size:24px;padding:12px 40px">O</button><button class="pri" data-ans="X" style="font-size:24px;padding:12px 40px;background:var(--coral);border-color:var(--coral)">X</button></div>`:`<div class="row"><input type="text" id="ans" placeholder="답 입력 (분수는 3/4, 음수는 -2)" autocomplete="off" inputmode="${p.b.kind==='num'?'text':'text'}" style="flex:1;min-width:200px;font-size:18px"><button class="pri" id="ok">확인</button></div><div class="row" style="margin-top:6px">${['-','/','√','π','.'].map(c=>`<button class="sm" data-k="${c}">${c}</button>`).join('')}${opt.hint?'<button class="sm" id="hint">💡 힌트</button>':''}</div>`}
  <div id="fb" style="margin-top:12px;min-height:30px"></div></div>`;
  const inp=$('#ans');if(inp){inp.focus();$$('[data-k]').forEach(b=>b.onclick=()=>{inp.value+=b.dataset.k;inp.focus()})}
  const hb=$('#hint');if(hb)hb.onclick=()=>{used++;hints++;hb.disabled=used>=2;$('#fb').innerHTML=`<div class="card soft">💡 ${used===1?'풀이 방향: '+esc(p.sol):'정답은 <b>'+esc(p.a)+'</b> 입니다. 직접 입력해 보세요.'}</div>`};
  const done=user=>{const r=checkAns(p.b.kind,user,p.a);const score=r?(used?50:100):0;if(r&&!used)ok++;res.push({p,user,r,used});logAct('문제 풀이',p.b.name+(used?' (힌트)':''),r?100:0,p.b.topic);if(r)markRight(p.b);else addWrong(p.b);
   $$('#ok,[data-ans]').forEach(b=>b.disabled=true);$('#fb').innerHTML=`<div class="card soft" style="border-left:4px solid ${r?'var(--good)':'var(--bad)'}"><b>${r?(used?'정답 (힌트 사용)':'정답! 🎉'):'오답'}</b> — 정답: <b>${esc(p.a)}</b><div style="font-size:14px;margin-top:4px">풀이: ${esc(p.sol)}</div><div class="row" style="margin-top:8px"><button class="pri" id="nx">${i+1<qs.length?'다음':'결과 보기'}</button></div></div>`;$('#nx').onclick=()=>{i++;i<qs.length?one():end()};$('#nx').focus()};
  const okb=$('#ok');if(okb){okb.onclick=()=>{if(!inp.value.trim()){toast('답을 입력하세요');return}done(inp.value)};inp.onkeydown=e=>{if(e.key==='Enter'&&!okb.disabled)okb.click()}}
  $$('[data-ans]').forEach(b=>b.onclick=()=>done(b.dataset.ans))};
 const end=()=>{const s=Math.round(ok/qs.length*100);logAct(opt.label,qs.length+'문제'+(hints?' 힌트 '+hints:''),s,qs.length===1?qs[0].b.topic:null);checkBadges();el.innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">${esc(opt.label)} 결과</div><h2 style="font-size:48px;margin:6px 0">${s}점</h2><p>${ok}/${qs.length} 정답 · 힌트 ${hints}회 · ${s>=90?'완벽해요! 🏆':s>=70?'잘했어요 👍':'오답 노트에서 다시 만나요 🔁'}</p><div class="row" style="justify-content:center"><button class="pri" id="ag">새 세트</button><button id="rv">오답 보기</button></div></div><div id="rvBody"></div>`;$('#ag').onclick=()=>{S.sub=null;render()};$('#rv').onclick=()=>{$('#rvBody').innerHTML=res.filter(x=>!x.r).map(x=>`<div class="card" style="margin-top:8px;border-left:4px solid var(--bad)"><div>${x.p.q}</div><div style="font-size:13px;margin-top:4px">내 답: ${esc(x.user)} → 정답 <b>${esc(x.p.a)}</b> · ${esc(x.p.sol)}</div></div>`).join('')||'<div class="card">틀린 문제가 없어요! 🎉</div>'}};

function sExam(el){el.innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">📝 모의고사</div><h3>해설 없이 한 번에 풀고 채점 · 제한 시간</h3></div><div class="row"><select id="exN"><option value="10">10문제</option><option value="20" selected>20문제</option></select><select id="exT"><option value="15">15분</option><option value="30" selected>30분</option><option value="0">무제한</option></select><button class="pri" id="exGo">시험 시작</button></div></div><p style="font-size:13px;color:var(--muted);margin:6px 0 0">최근: ${store.get('log',[]).filter(l=>l.n===S.student.no&&l.s===S.student.name&&l.type==='모의고사').slice(-5).map(l=>l.score+'점').join(', ')||'없음'}</p></div><div id="exBody"></div>`;
 $('#exGo').onclick=()=>{const n=+$('#exN').value,mins=+$('#exT').value;ex={qs:pickProblems(S.grade,'all',n).map(p=>({...p,user:''})),end:mins?Date.now()+mins*60000:0};drawEx();if(mins)ex.iv=setInterval(()=>{const l=Math.max(0,ex.end-Date.now());const t=$('#exClock');if(t)t.textContent=Math.floor(l/60000)+':'+String(Math.floor(l%60000/1000)).padStart(2,'0');if(l<=0)gradeEx()},500)}}
function drawEx(){$('#exBody').innerHTML=`<div class="card"><div class="row between"><b>${ex.qs.length}문제</b><span class="pill num" id="exClock">${ex.end?'':'무제한'}</span></div></div>`+ex.qs.map((p,i)=>`<div class="card" style="margin-top:8px"><div class="eyebrow">${i+1}번 · ${esc(p.b.topic)}</div><div class="q" style="font-size:16px">${p.q}</div>${p.b.kind==='ox'?`<div class="row"><button class="sm ${p.user==='O'?'act':''}" data-ox="${i}" data-v="O">O</button><button class="sm ${p.user==='X'?'act':''}" data-ox="${i}" data-v="X">X</button></div>`:`<input type="text" data-ex="${i}" value="${esc(p.user)}" placeholder="답" style="width:200px">`}</div>`).join('')+`<div class="card" style="margin-top:10px;text-align:center"><button class="pri" id="exSub">답안 제출</button></div>`;
 $$('[data-ex]').forEach(i=>i.oninput=()=>ex.qs[+i.dataset.ex].user=i.value);$$('[data-ox]').forEach(b=>b.onclick=()=>{ex.qs[+b.dataset.ox].user=b.dataset.v;$$(`[data-ox="${b.dataset.ox}"]`).forEach(x=>x.classList.toggle('act',x.dataset.v===b.dataset.v))});$('#exSub').onclick=gradeEx}
function gradeEx(){clearInterval(ex.iv);let ok=0;ex.qs.forEach(p=>{p.r=checkAns(p.b.kind,p.user,p.a);if(p.r){ok++;markRight(p.b)}else addWrong(p.b);logAct('문제 풀이',p.b.name+' (모의고사)',p.r?100:0,p.b.topic)});const s=Math.round(ok/ex.qs.length*100);logAct('모의고사',ex.qs.length+'문제',s);checkBadges();$('#exBody').innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">채점 결과</div><h2 style="font-size:48px;margin:6px 0">${s}점</h2><p>${ok}/${ex.qs.length} 정답 · ${s>=90?'1등급 🏆':s>=70?'잘했어요':'오답 노트로 복습!'}</p></div>`+ex.qs.map((p,i)=>`<div class="card" style="margin-top:8px;border-left:4px solid ${p.r?'var(--good)':'var(--bad)'}"><b>${i+1}. </b>${p.q}<div style="font-size:14px;margin-top:4px">내 답: ${esc(p.user||'(미응답)')} ${p.r?'<span class="pill good">정답</span>':'<span class="pill bad">오답</span>'} · 정답 <b>${esc(p.a)}</b> · ${esc(p.sol)}</div></div>`).join('')}

 const g=$('#rvGo');if(g)g.onclick=()=>{const qs=due.map(w=>{const b=allBank().find(x=>String(x.id)===String(w.id));return b?{b,...b.gen()}:null}).filter(Boolean);runSet(el,qs,{hint:false,label:'오답 복습'})}}

 $$('[data-qs]').forEach(b=>b.onclick=()=>{const body=$(`[data-qa="${b.dataset.qs}"]`).value.trim();if(!body)return;const all=store.get('qna',[]);const q=all.find(x=>x.id===b.dataset.qs);q.answers.push({s:'유찬쌤',body,t:Date.now(),teacher:true});store.set('qna',all);tQna(el)});$$('[data-qd]').forEach(b=>b.onclick=()=>{const all=store.get('qna',[]);all.find(x=>x.id===b.dataset.qd).solved=true;store.set('qna',all);tQna(el)});$$('[data-del]').forEach(b=>b.onclick=()=>{store.set('qna',store.get('qna',[]).filter(x=>x.id!==b.dataset.del));tQna(el)})}
function tRank(el){if(!requireTeacher())return;const g=S.sub||'m1';const rows=Object.values(store.get('students',{})).filter(s=>s.g===g&&s.no>0).map(s=>({...s,pts:weekPoints(s.no,s.name),badges:badgesOf(s.no,s.name)})).sort((a,b)=>b.pts-a.pts);el.innerHTML=`<div class="card"><div class="row between"><h3>🏆 학급 랭킹 & 배지</h3><select id="rkG">${GRADES.map(x=>`<option value="${x[0]}" ${x[0]===g?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="scroll" style="margin-top:8px"><table><tr><th>순위</th><th>번호</th><th>이름</th><th class="tright">주간 점수</th><th>배지</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="num">${r.no}</td><td>${esc(r.name)}</td><td class="tright num">${r.pts}</td><td>${r.badges.map(b=>`<span title="${b[2]}">${b[1]}</span>`).join(' ')||'–'}</td></tr>`).join('')||'<tr><td colspan="5">없음</td></tr>'}</table></div></div>`;$('#rkG').onchange=e=>{S.sub=e.target.value;save();tRank(el)}}
function tPick(el){if(!requireTeacher())return;let picked=store.get('pkHist',[]);let tm=0,iv=null;el.innerHTML=`<div class="grid2"><div class="card"><h3>🎲 발표자 뽑기</h3><div class="row" style="margin:8px 0"><label style="font-size:13px">학생 수 <input type="number" id="pkN" value="${store.get('pkN',25)}" min="2" max="60" style="width:70px"></label><label style="font-size:13px"><input type="checkbox" id="pkNo" checked> 뽑힌 번호 제외</label><button class="pri" id="pkGo">뽑기!</button><button class="sm" id="pkR">초기화</button></div><div id="pkOut" style="text-align:center;font-family:var(--display);font-size:72px;min-height:90px">?</div><div id="pkH" style="font-size:13px;color:var(--muted);text-align:center"></div></div><div class="card"><h3>⏱️ 타이머 · 🎯 즉석 문제</h3><div style="text-align:center;font-family:var(--display);font-size:56px;margin:8px 0" id="tmOut">00:00</div><div class="row" style="justify-content:center">${[1,3,5,10].map(m=>`<button class="sm" data-tm="${m}">${m}분</button>`).join('')}<button class="pri" id="tmGo">시작</button><button class="sm" id="tmStop">정지</button></div><div class="row" style="margin-top:14px"><select id="qkG">${GRADES.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><button class="pri" id="qkGo">칠판용 문제 뽑기</button></div><div id="qkOut" style="margin-top:8px"></div></div></div>`;
 const dh=()=>$('#pkH').textContent=picked.length?'뽑힌 번호: '+picked.join(', '):'';dh();$('#pkN').onchange=e=>store.set('pkN',+e.target.value);$('#pkGo').onclick=()=>{const n=+$('#pkN').value;const pool=[...Array(n)].map((_,i)=>i+1).filter(x=>!$('#pkNo').checked||!picked.includes(x));if(!pool.length){toast('모두 뽑혔어요');return}let k=0;const r=setInterval(()=>{$('#pkOut').textContent=1+R(0,n-1);if(++k>15){clearInterval(r);const v=pool[R(0,pool.length-1)];$('#pkOut').textContent=v+'번';picked.push(v);store.set('pkHist',picked);dh()}},60)};$('#pkR').onclick=()=>{picked=[];store.set('pkHist',[]);dh();$('#pkOut').textContent='?'};
 const dr=()=>$('#tmOut').textContent=String(Math.floor(tm/60)).padStart(2,'0')+':'+String(tm%60).padStart(2,'0');$$('[data-tm]').forEach(b=>b.onclick=()=>{tm=+b.dataset.tm*60;dr()});$('#tmGo').onclick=()=>{clearInterval(iv);iv=setInterval(()=>{if(tm>0){tm--;dr();if(tm===0){toast('⏰ 종료');clearInterval(iv)}}},1000)};$('#tmStop').onclick=()=>clearInterval(iv);
 $('#qkGo').onclick=()=>{const p=pickProblems($('#qkG').value,'all',1)[0];$('#qkOut').innerHTML=`<div class="card soft"><div class="eyebrow">${esc(p.b.topic)}</div><div style="font-family:var(--display);font-size:26px;margin:6px 0">${p.q}</div><details><summary style="font-size:13px">정답 보기</summary><b>${esc(p.a)}</b> · ${esc(p.sol)}</details></div>`}}
function tPreview(el){if(!requireTeacher())return;el.innerHTML=`<div class="card"><h3>🎒 학생 화면 미리보기</h3><p style="font-size:14px;color:var(--muted)">"선생님(미리보기)" 이름으로 학생 모드에 들어갑니다(통계 제외).</p><div class="row"><select id="pvG">${GRADES.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join('')}</select><button class="pri" id="pv">학생 모드로</button></div></div>`;$('#pv').onclick=()=>{S={role:'student',student:{name:'선생님(미리보기)',no:0},grade:$('#pvG').value,tab:'home',fromTeacher:true};save();render()}}
function tData(el){if(!requireTeacher())return;const L=store.get('log',[]);el.innerHTML=`<div class="grid2"><div class="card"><h3>📨 학생 활동 코드 가져오기</h3><p style="font-size:13px;color:var(--muted)">학생이 복사한 "MA1:…" 코드를 붙여 넣으면 통계에 합쳐집니다.</p><textarea id="imp" style="min-height:120px" placeholder="MA1:..."></textarea><button class="pri" id="impGo" style="margin-top:8px">가져오기</button><div id="impRes" style="font-size:13px;margin-top:6px"></div></div><div class="card"><h3>💾 백업·복원·초기화</h3><div class="row"><button class="sm" id="bk">전체 백업 복사</button><button class="sm" id="rs">백업 복원</button><button class="sm" id="csv">활동 CSV 복사</button></div><div class="row" style="margin-top:10px"><button class="sm" id="clearLog" style="color:var(--bad)">활동 기록만 지우기</button><button class="sm" id="clearAll" style="color:var(--bad)">전체 초기화</button></div><div id="confirm" style="margin-top:8px"></div><p style="font-size:13px;color:var(--muted);margin-top:12px">🔐 비밀번호는 해시(SHA-256)만 저장됩니다. 바꾸려면 코드 상단 TEACHER_PW_HASH를 교체하세요.</p></div></div>`;
 $('#impGo').onclick=()=>{const codes=$('#imp').value.split(/\s+/).filter(c=>c.startsWith('MA1:'));let n=0,sn=0;const log=store.get('log',[]),subs=store.get('subs',[]),students=store.get('students',{});const seen=new Set(log.map(l=>l.t+'|'+l.n+'|'+l.s));codes.forEach(c=>{try{const d=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));d.log.forEach(l=>{const k=l.t+'|'+l.n+'|'+l.s;if(!seen.has(k)){log.push(l);seen.add(k);n++}});const ss=new Set(subs.map(s=>s.t+'|'+s.n));d.subs.forEach(s=>{if(!ss.has(s.t+'|'+s.n)){subs.push(s);sn++}});const k=d.st.no+'|'+d.st.name;students[k]=students[k]||{name:d.st.name,no:d.st.no,g:d.g,first:Date.now()};students[k].last=Date.now()}catch(e){}});log.sort((a,b)=>a.t-b.t);store.set('log',log.slice(-3000));store.set('subs',subs.slice(-500));store.set('students',students);$('#impRes').innerHTML=`<span class="pill good">활동 ${n}건, 제출물 ${sn}건</span>`};
 const all=()=>{const o={};try{Object.keys(localStorage).filter(k=>k.startsWith('ma.')&&k!=='ma.session').forEach(k=>o[k]=localStorage.getItem(k))}catch(e){}return JSON.stringify(o)};$('#bk').onclick=()=>navigator.clipboard.writeText(all()).then(()=>toast('복사')).catch(()=>toast('복사 차단'));
 $('#rs').onclick=()=>{const b=document.createElement('div');b.className='overlay';b.innerHTML='<div class="box"><b>백업 붙여넣기</b><textarea id="rsT"></textarea><div class="row" style="margin-top:8px"><button class="pri" id="rsOk">복원</button><button class="sm" id="rsNo">취소</button></div></div>';document.body.appendChild(b);$('#rsNo').onclick=()=>b.remove();$('#rsOk').onclick=()=>{try{Object.entries(JSON.parse($('#rsT').value)).forEach(([k,v])=>{if(k.startsWith('ma.'))localStorage.setItem(k,v)});b.remove();toast('복원');tData(el)}catch(e){toast('형식 오류')}}};
 $('#csv').onclick=()=>navigator.clipboard.writeText('시간,학년,번호,이름,활동,단원,내용,점수\n'+L.map(l=>[new Date(l.t).toLocaleString('ko-KR'),gname(l.g),l.n,l.s,l.type,l.topic||'','"'+l.detail.replace(/"/g,'""')+'"',l.score??''].join(',')).join('\n')).then(()=>toast('CSV 복사')).catch(()=>toast('복사 차단'));
 const ask=(msg,fn)=>{$('#confirm').innerHTML=`<div class="notice">${msg} <button class="sm" id="yes" style="color:var(--bad)">네</button> <button class="sm" id="no">취소</button></div>`;$('#yes').onclick=()=>{fn();$('#confirm').innerHTML='';tData(el)};$('#no').onclick=()=>$('#confirm').innerHTML=''};$('#clearLog').onclick=()=>ask('활동 기록을 모두 지울까요?',()=>store.set('log',[]));$('#clearAll').onclick=()=>ask('모든 데이터를 지울까요?',()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('ma.')&&k!=='ma.session').forEach(k=>localStorage.removeItem(k))}catch(e){}})}

/* ================= GATE / SHELL ================= */
function renderGate(){$('#app').innerHTML=`<div class="gate"><div class="box"><div class="eyebrow">풀고 · 겨루고 · 탐구하는 교실</div><h1>수학 <span>교실</span></h1><p class="sub">랜덤 문제 ${BANK.length}종, 보스전, 그래프 탐색기까지. 누구로 들어갈까요?</p><div class="roles">
 <div class="role" id="rStudent"><div class="big">🎒</div><h3>학생으로 입장</h3><p>이름과 번호만 적으면 바로 시작. 푼 문제·게임·제출 기록이 선생님께 전달됩니다.</p><form id="fStudent"><div class="row"><input type="text" id="sName" placeholder="이름" required style="flex:1;min-width:100px"><input type="number" id="sNo" placeholder="번호" min="1" max="99" required style="width:90px"></div><select id="sGrade">${GRADES.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join('')}</select><button class="pri" type="submit">입장하기 →</button></form></div>
 <div class="role" id="rTeacher"><div class="big">👨‍🏫</div><h3>선생님으로 입장</h3><p>닉네임과 비밀번호가 필요해요. 통계·히트맵·과제·루브릭 채점을 관리합니다.</p><form id="fTeacher"><input type="text" id="tId" placeholder="닉네임" autocomplete="username"><input type="password" id="tPw" placeholder="비밀번호" autocomplete="current-password"><button class="pri" type="submit">로그인 →</button><div id="tErr" style="font-size:13px;color:var(--bad);min-height:18px"></div></form></div></div>
 <p style="font-size:12px;color:var(--muted);margin-top:24px">최근 학생: ${Object.values(store.get('students',{})).filter(s=>s.no>0).slice(-5).map(s=>esc(s.name)).join(', ')||'아직 없음'}</p></div></div>`;
 const last=store.get('lastStudent');if(last){$('#sName').value=last.name;$('#sNo').value=last.no;$('#sGrade').value=last.g}
 $('#fStudent').onsubmit=e=>{e.preventDefault();const name=$('#sName').value.trim(),no=+$('#sNo').value;if(!name||!no){toast('이름과 번호를 입력하세요');return}S={role:'student',student:{name,no},grade:$('#sGrade').value,tab:'home'};store.set('lastStudent',{name,no,g:S.grade});save();logAct('입장','학생 입장');render()};
 $('#fTeacher').onsubmit=async e=>{e.preventDefault();const hi=await sha($('#tId').value.trim()),hp=await sha($('#tPw').value);if(hi===null){$('#tErr').textContent='이 브라우저에서는 로그인 기능을 쓸 수 없습니다(https 필요).';return}if(hi===TEACHER_ID_HASH&&hp===TEACHER_PW_HASH){S={role:'teacher',student:null,grade:'m1',tab:'dash'};save();toast('유찬쌤, 환영합니다 👋');render()}else{$('#tErr').textContent='닉네임 또는 비밀번호가 맞지 않습니다.';$('#tPw').value=''}}}
function logout(){if(S.role==='student')logAct('퇴장','학생 퇴장');S={role:null,student:null,grade:'m1',tab:'home'};save();render()}
const STUDENT_TABS=[['home','🏠 홈'],['practice','🧮 문제 풀기'],['speed','⚡ 스피드'],['boss','🐉 보스전'],['games','🎲 게임'],['tools','🛠️ 도구'],['formula','📐 공식'],['units','📚 단원 요약'],['range','📌 시험 범위'],['exam','📝 모의고사'],['write','✍️ 서술형'],['review','🔁 오답'],['qna','💬 질문'],['rank','🏆 랭킹'],['notice','📢 공지·과제'],['my','📈 내 기록']];
const TEACHER_TABS=[['dash','📊 통계'],['heat','🔥 히트맵'],['students','👥 학생별'],['units','📚 단원 요약'],['range','📌 시험 범위'],['notice','📢 공지·과제'],['submit','📥 제출물'],['grade','📝 루브릭 채점'],['bank','✍️ 문제 등록'],['qna','💬 질문 관리'],['rank','🏆 랭킹'],['pick','🎲 뽑기·타이머'],['preview','🎒 학생 화면'],['data','💾 기록 관리']];
function render(){if(!S.role){renderGate();return}const tabs=S.role==='teacher'?TEACHER_TABS:STUDENT_TABS;if(!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];const dueN=S.role==='student'?dueList().length:0;
 $('#app').innerHTML=`<header class="top"><div class="brand"><div class="mark">∑</div><div><h1>수학 교실</h1><small>${S.role==='teacher'?'선생님 모드 · 유찬쌤':gname(S.grade)+' 학생 모드'}</small></div></div>${S.role==='student'?`<select id="gradeSel">${GRADES.map(g=>`<option value="${g[0]}" ${g[0]===S.grade?'selected':''}>${g[1]}</option>`).join('')}</select>`:''}<div class="who"><span class="chip ${S.role==='teacher'?'t':'s'}">${S.role==='teacher'?'👨‍🏫 유찬쌤':'🎒 '+esc(S.student.name)+' ('+S.student.no+'번)'}</span><button class="sm" id="logout">나가기</button></div></header>
 <div class="wrap"><nav class="tabs">${tabs.map(t=>`<button class="${t[0]===S.tab?'on':''}" data-tab="${t[0]}">${t[1]}${t[0]==='review'&&dueN?` <span class="pill bad" style="padding:0 6px">${dueN}</span>`:''}</button>`).join('')}</nav><section id="content"></section></div><div class="footer">수학 교실 · 틀려도 괜찮아, 다시 풀면 되니까 ∑</div>`;
 $('#logout').onclick=logout;$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.sub=null;save();render()});const gs=$('#gradeSel');if(gs)gs.onchange=e=>{S.grade=e.target.value;save();render()};
 const map=S.role==='teacher'?{dash:tDash,heat:tHeat,students:tStudents,units:tUnits,range:tRange,notice:tNotice,submit:tSubmit,grade:tGrade,bank:tBank,qna:tQna,rank:tRank,pick:tPick,preview:tPreview,data:tData}:{home:sHome,practice:sPractice,speed:sSpeed,boss:sBoss,games:sGames,tools:sTools,formula:sFormula,units:sUnits,range:sRange,exam:sExam,write:sWrite,review:sReview,qna:sQna,rank:sRank,notice:sNotice,my:sMy};
 map[S.tab]($('#content'));
 if(S.role==='student'&&S.fromTeacher&&!$('#backT')){const b=document.createElement('button');b.id='backT';b.textContent='👨‍🏫 선생님 모드로';b.className='pri';b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:20';b.onclick=()=>{S={role:'teacher',student:null,grade:'m1',tab:'dash'};save();b.remove();render()};document.body.appendChild(b)}}
render();

</script>
